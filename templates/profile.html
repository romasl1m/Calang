<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile - Calang</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="theme-color" content="#0a0e27">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-dark: #0a0e27;
            --navy-medium: #131729;
            --navy-light: #1a1f3a;
            --purple-primary: #8b5cf6;
            --purple-light: #a78bfa;
            --blue-primary: #3b82f6;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: var(--navy-dark);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text-primary); overflow-x: hidden; }

        /* Animated Background */
        .background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1729 100%);
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }
        .blob-1 {
            width: 500px; height: 500px; background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
            top: -10%; left: -10%; animation-delay: 0s;
        }
        .blob-2 {
            width: 400px; height: 400px; background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
            bottom: -10%; right: -5%; animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .header h1 {
            margin-left: 20px;
            font-size: 24px;
            font-weight: 600;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 24px;
        }

        .profile-picture-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--purple-primary);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
            margin-bottom: 16px;
            background-color: var(--navy-medium);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .profile-picture:hover {
            transform: scale(1.05);
        }

        .change-pic-btn {
            background: transparent;
            border: 1px solid var(--purple-primary);
            color: var(--purple-light);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .change-pic-btn:hover {
            background: rgba(139, 92, 246, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--purple-primary);
        }

        .save-btn {
            width: 100%;
            background: var(--purple-primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .save-btn:hover {
            background: #7c3aed;
        }

        .danger-zone {
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .danger-zone h2 {
            color: var(--danger);
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .danger-zone p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .delete-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        #file-input {
            display: none;
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--navy-medium);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal h3 {
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .modal p {
            color: var(--text-secondary);
            margin-bottom: 25px;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }

        .modal-btn-cancel {
            background: var(--glass-bg);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }

        .modal-btn-confirm {
            background: var(--danger);
            color: white;
        }

    </style>
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <div class="header">
            <a href="/dashboard" class="back-btn">← Back to Dashboard</a>
            <h1>Profile</h1>
        </div>

        <div class="card">
            <div class="profile-picture-container">
                <img src="{{profile_picture}}" alt="Profile" class="profile-picture" id="profile-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'120\' height=\'120\'><rect width=\'120\' height=\'120\' fill=\'%231a1f3a\'/><text x=\'50%\' y=\'50%\' fill=\'%23e2e8f0\' font-size=\'40\' text-anchor=\'middle\' dy=\'.3em\'>{{username}}</text></svg>'">
                <button class="change-pic-btn" onclick="document.getElementById('file-input').click()">Change Picture</button>
                <input type="file" id="file-input" accept="image/*">
            </div>

            <form id="profile-form">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name-input" value="{{name}}" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username-input" value="{{username}}" placeholder="Username">
                </div>
                <button type="submit" class="save-btn">Save Changes</button>
            </form>
        </div>

        <div class="card danger-zone">
            <h2>Danger Zone</h2>
            <p>Once you delete your account, there is no going back. Please be certain.</p>
            <button class="delete-btn" onclick="showDeleteModal()">Delete Account</button>
        </div>
    </div>

    <div class="modal-overlay" id="delete-modal">
        <div class="modal">
            <h3>Delete Account?</h3>
            <p>Are you sure you want to delete your account? All your private events will be lost.</p>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" onclick="hideDeleteModal()">Cancel</button>
                <button class="modal-btn modal-btn-confirm" onclick="confirmDelete()">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64 = event.target.result;
                document.getElementById('profile-img').src = base64;
                
                // Upload
                fetch('/api/profile/picture', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({picture: base64})
                }).then(res => {
                    if (!res.ok) alert('Failed to update picture');
                });
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('profile-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name-input').value;
            const username = document.getElementById('username-input').value;

            fetch('/api/profile/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name, username: username})
            }).then(async res => {
                if (res.ok) {
                    alert('Profile updated successfully!');
                    if (username !== '{{username}}') {
                        window.location.reload();
                    }
                } else {
                    const text = await res.text();
                    alert('Error: ' + text);
                }
            });
        });

        function showDeleteModal() {
            document.getElementById('delete-modal').classList.add('active');
        }

        function hideDeleteModal() {
            document.getElementById('delete-modal').classList.remove('active');
        }

        function confirmDelete() {
            fetch('/api/profile/delete', {
                method: 'POST'
            }).then(res => {
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    alert('Failed to delete account');
                }
            });
        }
    </script>
</body>
</html>
